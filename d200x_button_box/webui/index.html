<!doctype html>
<meta charset="utf-8">
<title>D200x Button Box</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">

<header>
  <span class="brand"><span id="dot" title="daemon connection"></span> D200x</span>

  <div class="profilebar">
    <span class="lbl">profile</span>
    <select id="profileSel" title="active profile"></select>
    <button id="profilesBtn" class="ghost" title="add / rename / delete profiles">Manage…</button>
  </div>

  <span class="spacer"></span>

  <span id="status" class="statuspill"></span>
  <button id="saveBtn" class="primary" hidden>Save</button>
  <button id="listenBtn" class="ghost" title="press a control on the deck to select it here">Listen</button>
  <button id="iconsBtn" class="ghost">Icons</button>
  <button id="settingsBtn" class="ghost" title="settings">Settings</button>
</header>

<div class="workspace">
  <aside id="rail" hidden></aside>
  <div class="deckwrap">
    <div id="deck"></div>
    <div id="pagestrip" class="pagestrip"></div>
  </div>
  <aside id="editor"></aside>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="scrim"></div>
<div id="drawer" aria-hidden="true">
  <header>
    <h3 id="drawer_title">Settings</h3>
    <button id="drawer_close" title="close">✕</button>
  </header>
  <div id="drawer_body" class="dbody"></div>
</div>

<dialog id="iconGen">
  <h3 id="ig_title">Icon</h3>
  <p class="hint" id="ig_note"></p>
  <div style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap">
    <img id="ig_prev" width="110" height="110" style="background:#0d0f13;border:1px solid var(--line);border-radius:8px" alt="">
    <div style="flex:1;min-width:200px">
      <div class="fld" id="ig_text_fld"><label>Text</label><input id="ig_text" type="text" maxlength="4"><div class="hint">1–4 letters (empty = auto from the label)</div></div>
      <div class="fld" id="ig_mode_fld"><label>Frame</label><select id="ig_mode"><option value="solid">solid</option><option value="ring">outline only</option></select></div>
      <div class="fld" id="ig_shape_fld"><label>Shape</label><select id="ig_shape"><option value="circle">circle</option><option value="round">rounded square</option></select></div>
      <div class="fld" id="ig_font_fld"><label>Font</label><select id="ig_font"><option value="sans">sans</option><option value="condensed">condensed</option><option value="mono">mono</option><option value="liberation">liberation</option></select></div>
      <div class="fld" id="ig_border_fld"><label>Frame line</label><input id="ig_border" type="color"></div>
      <div class="fld" id="ig_fill_fld"><label>Frame fill</label><input id="ig_fill" type="color"><div class="hint">only visible with a solid frame</div></div>
      <div class="fld"><label id="ig_fg_lbl">Icon / text</label><input id="ig_fg" type="color"></div>
      <div class="fld" id="ig_sync_fld"><label></label><label style="display:flex;gap:.4rem;align-items:center"><input id="ig_sync" type="checkbox"> icon colour = frame line</label></div>
    </div>
  </div>
  <div class="dlg-actions"><button id="ig_reset" class="ghost">use page default</button><button id="ig_cancel" class="ghost">Cancel</button><button id="ig_use" class="primary">Use this icon</button></div>
</dialog>

<dialog id="symPick" style="max-width:42rem">
  <h3>Choose a symbol</h3>
  <input id="sym_q" type="search" placeholder="search — wiper, tc, radio, home…" autocomplete="off" style="width:100%">
  <div id="sym_grid"></div>
  <div class="dlg-actions">
    <button id="sym_clear" class="ghost">Use auto instead</button>
    <button id="sym_cancel" class="ghost">Cancel</button>
  </div>
</dialog>

<dialog id="composeDlg" style="max-width:44rem">
  <h3>Icon editor</h3>
  <div style="display:flex;gap:1.2rem;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:.5rem">
      <div style="display:flex;gap:.5rem">
        <img id="c_prev_d" width="120" height="120" style="background:#0d0f13;border:1px solid var(--line);border-radius:8px" alt="">
        <img id="c_prev_l" width="120" height="120" style="background:#e9ecf1;border:1px solid var(--line);border-radius:8px" alt="">
      </div>
      <div class="fld"><label>Icon</label><span style="display:flex;gap:.3rem"><select id="c_name" style="flex:1"></select><button id="c_new" class="ghost" title="new composed icon">＋</button></span></div>
      <div class="hint" id="c_state"></div>
    </div>
    <div style="flex:1;min-width:260px">
      <div class="fld"><label>Base</label><select id="c_base"></select></div>
      <div class="fld"><label>Scale</label><input id="c_scale" type="number" step="0.01" min="0.05" max="2"></div>
      <div class="fld"><label>Pos X / Y</label><span><input id="c_bx" type="number" step="0.01" style="width:5rem"> <input id="c_by" type="number" step="0.01" style="width:5rem"></span></div>
      <div style="border-top:1px solid var(--line);margin:.6rem 0;padding-top:.4rem">
        <b style="font-size:13px">Layers</b>
        <div id="c_layers" style="display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0"></div>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap">
          <button class="ghost" data-add="arrow">+ arrow</button>
          <button class="ghost" data-add="arc">+ arc</button>
          <button class="ghost" data-add="line">+ line</button>
          <button class="ghost" data-add="tick">+ tick</button>
          <button class="ghost" data-add="region" title="recolour / fill part of the symbol">+ region</button>
        </div>
      </div>
      <details style="margin-top:.6rem">
        <summary style="font-size:12px;cursor:pointer;color:var(--text-dim)">spec (JSON)</summary>
        <textarea id="c_json" readonly rows="9" style="width:100%;margin-top:.3rem;font:11px/1.4 ui-monospace,monospace;background:#0d0f13;color:var(--text);border:1px solid var(--line);border-radius:6px"></textarea>
        <button id="c_copy" class="ghost" style="margin-top:.2rem">copy</button>
        <span class="hint">to ship it: <code>d200x-button-box icons promote &lt;name&gt;</code> (reads your saved spec)</span>
      </details>
    </div>
  </div>
  <div class="dlg-actions"><button id="c_reset" class="ghost">Reset to built-in</button><button id="c_cancel" class="ghost">Cancel</button><button id="c_save" class="primary">Save</button></div>
</dialog>

<script type="module" src="app.js"></script>
